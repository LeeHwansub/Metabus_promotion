<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>metaBus Ending</title>
<!--
  metaBus 엔딩 크레딧 (ending_storybord2.png 기준) — HTML/CSS 모션그래픽
  사용: index.html?t=<0~5초>&a=<16x9|9x16>  → 그 시점의 한 프레임을 그린다 (결정적 렌더).
  t=0 은 본편 25.0초. 프레임 캡처는 render.sh.

  E01 0.0–0.8  알림 도착        3/4 Front, Slow Push-in
  E02 0.8–2.0  유리 초대장 등장  정면, 카드 등장 (궤도 링)
  E03 2.0–3.5  버스와 함께하는 초대  로우 앵글, 버스 등장 — 배경/버스 이미지: assets/
  E04 3.5–5.0  브랜드 엔딩      정면 고정, 로고·URL 등장 후 페이드아웃 — 배경 이미지: assets/
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #6F6CC8;
    font-family: -apple-system, "SF Pro Display", "Apple SD Gothic Neo", sans-serif; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .abs { position: absolute; }
  .kr { font-family: "Apple SD Gothic Neo", -apple-system, sans-serif; }
  .word { font-family: "Futura", "Avenir Next", sans-serif; font-weight: 500; letter-spacing: 0.01em; }

  /* ---------- 라벤더 노을 + 빛망울 ---------- */
  .dusk { position: absolute; inset: -10%;
    background:
      radial-gradient(ellipse 60% 45% at 20% 85%, rgba(255,205,180,.55), transparent 70%),
      radial-gradient(ellipse 50% 40% at 85% 75%, rgba(255,190,220,.45), transparent 70%),
      linear-gradient(180deg, #4E4FB0 0%, #7C78D4 45%, #B7A6EC 75%, #EBC3DF 100%); }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(var(--b, 22px)); }

  /* ---------- 폰 ---------- */
  .persp { position: absolute; inset: 0; perspective: 1700px; }
  .phone { position: absolute; border-radius: 9%/4.3%; transform-style: preserve-3d;
    background: linear-gradient(135deg, #565A6E, #23252F 40%, #3B3E4C 70%, #6B6F86);
    box-shadow: 0 60px 120px rgba(20,18,60,.45), inset 0 0 0 3px rgba(255,255,255,.18); }
  .screen { position: absolute; inset: 1.6%; border-radius: 8%/3.9%; overflow: hidden;
    background: linear-gradient(180deg, #8C88D8 0%, #6764BE 40%, #3B3E86 100%); }
  .island { position: absolute; left: 50%; top: 2.2%; width: 30%; height: 3.1%; transform: translateX(-50%);
    background: #050508; border-radius: 999px; }
  .status { position: absolute; top: 2.6%; right: 9%; display: flex; gap: .5em; align-items: center; }
  .clock { position: absolute; width: 100%; text-align: center; color: rgba(255,255,255,.95);
    font-family: -apple-system, "SF Pro Display"; font-weight: 300; letter-spacing: -.01em; }
  .date { position: absolute; width: 100%; text-align: center; color: rgba(255,255,255,.9); }
  .banner { position: absolute; left: 5%; right: 5%; border-radius: 2.6em; display: flex; align-items: center;
    background: rgba(240,238,252,.78); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 40px rgba(40,40,120,.18); }
  .app-icon { border-radius: 24%; background: linear-gradient(160deg, #2C3290, #151852); display: grid; place-items: center; flex: none; }
  .screen-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 40% at 50% 62%, rgba(214,222,255,.75), transparent 70%); }

  /* ---------- 유리 카드 ---------- */
  .glass { position: absolute; border-radius: 7%; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,.30), rgba(255,255,255,.08) 55%, rgba(190,200,255,.16));
    backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5);
    border: 2px solid rgba(255,255,255,.65);
    box-shadow: 0 0 0 1px rgba(170,185,255,.35), 0 0 60px rgba(150,170,255,.65), inset 0 0 40px rgba(255,255,255,.18),
                0 40px 90px rgba(30,30,110,.35); }
  .glass .sheen { position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 60%); }
  .card-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; color: #fff; }
  .divider { height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); }
  .btn { display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #fff; position: relative;
    background: linear-gradient(90deg, #5A72FF, #7C5CF6); box-shadow: 0 10px 30px rgba(90,100,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn .chev { position: absolute; right: 1.1em; }

  .flash { position: absolute; inset: 0; background: #F4F2FF; pointer-events: none; opacity: 0; }
  .fadeblack { position: absolute; inset: 0; background: #000; opacity: 0; }
  .placeholder { position: absolute; inset: 0; display: none; align-items: flex-end; justify-content: flex-start; padding: 24px;
    color: rgba(255,255,255,.8); font: 600 22px -apple-system; }
  img.layer { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="stage">

  <!-- ================= E01 알림 도착 ================= -->
  <section class="scene" id="e01">
    <div class="dusk"></div>
    <div id="e01-bokeh"></div>
    <div class="persp"><div class="phone" id="p1">
      <div class="screen">
        <div class="island"></div>
        <div class="status" id="p1-status"></div>
        <div class="clock" id="p1-clock">9:41</div>
        <div class="date kr" id="p1-date">11월 16일 일요일</div>
        <div class="screen-glow" id="p1-glow"></div>
        <div class="banner" id="p1-banner"></div>
      </div>
    </div></div>
    <svg class="abs" id="ding" viewBox="-60 -60 120 120"></svg>
  </section>

  <!-- ================= E02 유리 초대장 ================= -->
  <section class="scene" id="e02">
    <div class="dusk"></div>
    <div id="e02-bokeh"></div>
    <div class="persp"><div class="phone" id="p2"><div class="screen" style="filter:brightness(.85)"><div class="island"></div></div></div></div>
    <svg class="abs" id="orbit-back" style="left:0;top:0;width:100%;height:100%"></svg>
    <div class="persp"><div class="glass" id="card"><div class="sheen" id="card-sheen"></div><div class="card-inner" id="card-inner"></div></div></div>
    <svg class="abs" id="orbit-front" style="left:0;top:0;width:100%;height:100%"></svg>
    <svg class="abs" id="e02-sparks" style="left:0;top:0;width:100%;height:100%"></svg>
  </section>

  <!-- ================= E03 버스와 함께하는 초대 ================= -->
  <section class="scene" id="e03">
    <div class="dusk"></div>
    <img class="layer" id="e03-bg" alt="">
    <div class="abs" id="e03-streak" style="height:6px;border-radius:6px;filter:blur(2px);
      background:linear-gradient(90deg,transparent,#9DB4FF,#fff,#B79CFF,transparent)"></div>
    <div class="persp"><div class="glass" id="sky-card"><div class="sheen"></div><div class="card-inner" id="sky-card-inner" style="justify-content:center"></div></div></div>
    <img class="layer" id="e03-bus" alt="">
    <div class="placeholder" id="e03-ph">E03 이미지 필요: assets/e03_bg_*.png, assets/e03_bus_*.png (ASSET_PROMPTS.md)</div>
  </section>

  <!-- ================= E04 브랜드 엔딩 ================= -->
  <section class="scene" id="e04">
    <div class="dusk" style="background:linear-gradient(180deg,#1F2370 0%,#3A3FA6 45%,#7D78D6 80%,#B9A8F0 100%)"></div>
    <img class="layer" id="e04-bg" alt="">
    <svg class="abs" id="e04-orbit" style="left:0;top:0;width:100%;height:100%"></svg>
    <svg class="abs" id="e04-sparks" style="left:0;top:0;width:100%;height:100%"></svg>
    <div class="abs" id="e04-logo" style="display:flex;flex-direction:column;align-items:center;color:#fff"></div>
    <div class="placeholder" id="e04-ph">E04 배경 이미지 필요: assets/e04_bg_*.png (ASSET_PROMPTS.md)</div>
  </section>

  <div class="flash" id="flash"></div>
  <div class="fadeblack" id="fade"></div>
</div>

<script>
const Q = new URLSearchParams(location.search);
const T = parseFloat(Q.get('t') || '0');
const V = Q.get('a') === '9x16';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const $ = id => document.getElementById(id);
const stage = $('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 4);           // Quart ease-out
const eIn = k => k * k * k * k;
const eIO = k => -(Math.cos(Math.PI * k) - 1) / 2;   // Sine in-out
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

// ---------- m 심볼 (스토리보드 근사: 이탤릭 두 아치, 블루→바이올렛) ----------
let gid = 0;
function mMark(size) {
  const id = 'mg' + (gid++);
  return `<svg width="${size * 1.45}" height="${size}" viewBox="0 0 145 100" style="overflow:visible">
    <defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#4F7BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
    <path d="M 18 88 L 34 38 Q 42 16 62 20 Q 78 25 70 48 L 57 88 M 70 48 Q 80 18 100 20 Q 118 24 110 48 L 97 88"
      fill="none" stroke="url(#${id})" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// ---------- 공통 빌더 ----------
function bokeh(container, seed, n) {
  const r = rng(seed); let html = '';
  const cols = ['255,214,190', '255,232,210', '190,200,255', '214,198,255', '255,255,255', '160,170,240'];
  for (let i = 0; i < n; i++) {
    const s = 60 + r() * 200, x = r() * 110 - 5, y = r() * 110 - 5, c = cols[Math.floor(r() * cols.length)];
    html += `<div class="bokeh" data-x="${x}" data-y="${y}" data-d="${r()}" style="width:${s}px;height:${s}px;--b:${14 + r() * 16}px;
      background:radial-gradient(circle,rgba(${c},.75),rgba(${c},.25) 60%,transparent 72%)"></div>`;
  }
  container.innerHTML = html;
  return [...container.children];
}
function placeBokeh(els, t, drift) {
  els.forEach(el => {
    const d = +el.dataset.d;
    el.style.left = `calc(${el.dataset.x}% + ${(d - .5) * drift * t}px)`;
    el.style.top = `calc(${el.dataset.y}% + ${-d * drift * .4 * t}px)`;
  });
}
function sparkSVG(svg, pts, t) {
  svg.innerHTML = `<defs><filter id="${svg.id}-sb" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter></defs>` +
    pts.map(([x, y, s, t0]) => {
      const k = prog(t, t0, t0 + .25), tw = .6 + .4 * Math.sin((t - t0) * 9);
      return `<g transform="translate(${x} ${y}) scale(${s * (.6 + .4 * k)})" opacity="${k * tw}">
        <circle r="10" fill="rgba(220,228,255,.9)" filter="url(#${svg.id}-sb)"/>
        <path d="M0 -22 L3 -3 L22 0 L3 3 L0 22 L-3 3 L-22 0 L-3 -3 Z" fill="#fff"/></g>`;
    }).join('');
}
// 빛나는 타원 링 (half: 'back' 위쪽 반 / 'front' 아래쪽 반 / 'full')
function orbitSVG(svg, cx, cy, rx, ry, rot, reveal, alpha, half) {
  const id = svg.id;
  const len = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
  const clip = half === 'full' ? '' :
    `<clipPath id="${id}-c"><rect x="${-rx - 80}" y="${half === 'back' ? -ry - 80 : 0}" width="${2 * rx + 160}" height="${ry + 80}"/></clipPath>`;
  const ell = (w, op, blur) => `<ellipse rx="${rx}" ry="${ry}" fill="none" stroke="url(#${id}-g)" stroke-width="${w}"
      stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - reveal)}" opacity="${op}" ${blur ? `filter="url(#${id}-b${blur})"` : ''}/>`;
  svg.innerHTML = `<defs>
      <linearGradient id="${id}-g" gradientUnits="userSpaceOnUse" x1="${-rx}" x2="${rx}" y1="0" y2="0">
        <stop offset="0" stop-color="#7FA0FF" stop-opacity=".25"/><stop offset=".45" stop-color="#C9D5FF"/>
        <stop offset=".72" stop-color="#ffffff"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".6"/></linearGradient>
      <filter id="${id}-b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      <filter id="${id}-b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>${clip}</defs>
    <g transform="translate(${cx} ${cy}) rotate(${rot})" opacity="${alpha}">
      <g ${clip ? `clip-path="url(#${id}-c)"` : ''}>${ell(16, .55, 2)}${ell(6, .9, 1)}${ell(2.4, 1, 0)}</g></g>`;
}
function fillPhone(phone, w, lock) {
  phone.style.width = w + 'px'; phone.style.height = (w * 2.11) + 'px';
  if (!lock) return;
  $('p1-clock').style.cssText += `;top:${w * .27}px;font-size:${w * .33}px`;
  $('p1-date').style.cssText += `;top:${w * .66}px;font-size:${w * .055}px`;
  $('p1-status').innerHTML = `<svg width="${w * .08}" height="${w * .04}" viewBox="0 0 40 20">${[0, 1, 2, 3].map(i =>
    `<rect x="${i * 10}" y="${14 - i * 4}" width="7" height="${6 + i * 4}" rx="1.5" fill="#fff"/>`).join('')}</svg>
    <svg width="${w * .1}" height="${w * .045}" viewBox="0 0 50 22"><rect x="1" y="1" width="42" height="20" rx="6" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <rect x="4" y="4" width="34" height="14" rx="3.5" fill="#fff"/><rect x="45" y="7" width="3" height="8" rx="1.5" fill="#fff" fill-opacity=".6"/></svg>`;
  const b = $('p1-banner');
  b.style.cssText += `;top:${w * .9}px;height:${w * .26}px;padding:0 ${w * .05}px;gap:${w * .04}px`;
  b.innerHTML = `<div class="app-icon" style="width:${w * .16}px;height:${w * .16}px">${mMark(w * .08)}</div>
    <div style="flex:1;color:#15173A">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font:700 ${w * .052}px -apple-system">metaBus</span>
        <span class="kr" style="font-size:${w * .036}px;color:#6A6C8C">지금</span></div>
      <div class="kr" style="font-size:${w * .043}px;color:#2E3052;margin-top:${w * .01}px">새로운 경험이 기다리고 있습니다.</div></div>`;
}
function fillCard(inner, cw, full) {
  if (!full) { inner.innerHTML = mMark(cw * .42); return; }
  inner.style.padding = `${cw * .085}px ${cw * .08}px`;
  inner.innerHTML = `${mMark(cw * .14)}
    <div class="word" style="font-size:${cw * .105}px;margin-top:${cw * .02}px">metaBus</div>
    <div class="divider" style="width:80%;margin:${cw * .045}px 0 ${cw * .05}px"></div>
    <div class="kr" style="font-size:${cw * .066}px;line-height:1.42;text-align:center;font-weight:500">새로운 경험이<br>기다리고 있습니다.</div>
    <div class="btn kr" style="width:72%;height:${cw * .12}px;font-size:${cw * .052}px;margin-top:${cw * .06}px;font-weight:600">
      참여하기<span class="chev" style="font:300 ${cw * .065}px -apple-system">›</span></div>`;
}
function layer(img, src, w, h, onmissing) {
  img.onerror = onmissing;
  img.style.width = w + 'px'; img.style.height = h + 'px';
  img.src = src;
}

// ---------- 씬 구성 (1회) ----------
const B1 = bokeh($('e01-bokeh'), 7, 26), B2 = bokeh($('e02-bokeh'), 11, 22);
const P1W = V ? 700 : 560; fillPhone($('p1'), P1W, true);
const P2W = V ? 980 : 1000; fillPhone($('p2'), P2W, false);
const CW = V ? 820 : 720, CH = CW * .92;  // 내용(로고~버튼) 높이 ≈ 0.89·CW
const card = $('card'); card.style.width = CW + 'px'; card.style.height = CH + 'px';
fillCard($('card-inner'), CW, true);
const SKW = V ? 380 : 420; const sky = $('sky-card'); sky.style.width = SKW + 'px'; sky.style.height = SKW * .74 + 'px';
fillCard($('sky-card-inner'), SKW, false);
const LOGO = V ? 0.78 : 1;
$('e04-logo').innerHTML = `${mMark(150 * LOGO)}
  <div class="word" style="font-size:${180 * LOGO}px;line-height:1;margin-top:${14 * LOGO}px;text-shadow:0 0 40px rgba(170,180,255,.45)">metaBus</div>
  <div id="e04-url" style="font:400 ${48 * LOGO}px -apple-system;letter-spacing:.12em;color:#E4E0FF;margin-top:${34 * LOGO}px">metabus.app</div>`;
const sfx = V ? '9x16' : '16x9';
const miss = (img, ph) => () => { img.style.display = 'none'; $(ph).style.display = 'flex'; };
layer($('e03-bg'), `assets/e03_bg_${sfx}.png`, W * 1.12, H * 1.12, miss($('e03-bg'), 'e03-ph'));
layer($('e03-bus'), `assets/e03_bus_${sfx}.png`, V ? W * 1.15 : W * .62, V ? W * .7 : W * .38, miss($('e03-bus'), 'e03-ph'));
layer($('e04-bg'), `assets/e04_bg_${sfx}.png`, W * 1.06, H * 1.06, miss($('e04-bg'), 'e04-ph'));

// ---------- 렌더 ----------
function show(id, on) { $(id).style.visibility = on ? 'visible' : 'hidden'; }
function render(t) {
  ['e01', 'e02', 'e03', 'e04'].forEach(id => show(id, false));
  let flash = 0, fade = 0;

  if (t < 0.8) {                                      // ---------- E01 알림 도착
    show('e01', true);
    const k = eIO(prog(t, 0, .8));
    placeBokeh(B1, t, 120);
    const p = $('p1');
    const cx = V ? W * .52 : W * .47, cy = V ? H * .52 : H * .70;
    p.style.left = (cx - P1W / 2) + 'px'; p.style.top = (cy - P1W * 1.055) + 'px';
    p.style.transform = `rotateX(${lerp(24, 20, k)}deg) rotateY(${lerp(-20, -16, k)}deg) rotateZ(${lerp(-9, -7, k)}deg) scale(${lerp(1, 1.08, k)})`;
    const b = eOut(prog(t, .06, .32));
    $('p1-banner').style.opacity = b;
    $('p1-banner').style.transform = `translateY(${lerp(-40, 0, b)}px) scale(${lerp(.94, 1, b)})`;
    $('p1-glow').style.opacity = eOut(prog(t, .1, .35)) * (1 - .4 * prog(t, .45, .8));
    const d = prog(t, .14, .3), dOut = prog(t, .55, .8);
    const ding = $('ding'), ds = V ? 150 : 170;
    ding.style.cssText = `left:${cx - P1W * (V ? .62 : .75)}px;top:${cy - P1W * (V ? 1.05 : 1.12)}px;width:${ds}px;height:${ds}px;opacity:${eOut(d) * (1 - dOut)}`;
    ding.innerHTML = [150, 180, 210].map(a => {
      const r1 = 18 + 10 * eOut(d), r2 = r1 + 26, c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180);
      return `<line x1="${c * r1}" y1="${s * r1}" x2="${c * r2}" y2="${s * r2}" stroke="#fff" stroke-width="7" stroke-linecap="round"/>`;
    }).join('');
  } else if (t < 2.0) {                               // ---------- E02 유리 초대장
    show('e02', true);
    const u = t - .8, k = eIO(prog(u, 0, 1.2));
    placeBokeh(B2, t, 90);
    const p = $('p2');
    p.style.left = (W / 2 - P2W / 2) + 'px'; p.style.top = (H / 2 - P2W * 1.0) + 'px';
    p.style.transform = `rotateY(-8deg) rotateZ(3deg) scale(${lerp(1, 1.04, k)})`;
    const c = eOut(prog(u, .05, .55));
    const ccx = W / 2, ccy = H / 2 + (V ? 0 : 20);
    card.style.left = (ccx - CW / 2) + 'px'; card.style.top = (ccy - CH / 2) + 'px';
    card.style.opacity = c;
    card.style.transform = `translateY(${lerp(110, 0, c)}px) rotateX(${lerp(14, 8, c)}deg) rotateY(${lerp(-18, -12, c)}deg) rotateZ(${lerp(-5, -4, c)}deg) scale(${lerp(.9, 1, c) * lerp(1, 1.035, k)})`;
    $('card-sheen').style.transform = `translateX(${lerp(-70, 70, prog(u, .45, 1.1))}%)`;
    const rev = eOut(prog(u, .25, .8)), rot = lerp(-20, -12, k);
    // 위쪽 반은 카드 뒤, 아래쪽 반은 카드 아래 모서리 앞을 지나 본문 글자를 가리지 않게
    const rx = CW * .8, ry = CH * .64, oy = ccy + CH * .06;
    orbitSVG($('orbit-back'), ccx, oy, rx, ry, rot, rev, c, 'back');
    orbitSVG($('orbit-front'), ccx, oy, rx, ry, rot, rev, c, 'front');
    sparkSVG($('e02-sparks'), [[ccx - CW * .62, ccy - CH * .55, 1.1, 1.3], [ccx + CW * .7, ccy - CH * .1, 1.3, 1.45],
      [ccx - CW * .55, ccy + CH * .65, .8, 1.6], [ccx + CW * .45, ccy - CH * .75, .7, 1.7]], t);
    flash = .8 * eIn(prog(u, 1.02, 1.2));
  } else if (t < 3.5) {                               // ---------- E03 버스와 함께하는 초대
    show('e03', true);
    const v = t - 2.0, k = eOut(prog(v, 0, 1.5));
    const bg = $('e03-bg');
    bg.style.transform = `translate(-50%,-50%) scale(${lerp(1.12, 1.0, k)}) translateX(${lerp(2, -1, k)}%)`;
    bg.style.filter = `blur(${lerp(10, 0, eOut(prog(v, 0, .5)))}px)`;
    const bus = $('e03-bus');
    const bx = V ? lerp(.62, 0, k) : lerp(.55, -.08, k), by = V ? .2 : .14;
    bus.style.transform = `translate(calc(-50% + ${bx * W}px), calc(-50% + ${by * H}px)) scale(${lerp(.72, 1, k)})`;
    bus.style.filter = `blur(${lerp(6, 0, eOut(prog(v, 0, .6)))}px) drop-shadow(0 30px 40px rgba(40,30,110,.35))`;
    const st = $('e03-streak');
    st.style.width = W * .5 + 'px'; st.style.top = H * (V ? .74 : .86) + 'px';
    st.style.left = lerp(W, -W * .5, prog(v, .1, 1.1)) + 'px'; st.style.opacity = .9 * (1 - prog(v, .9, 1.2));
    const s = $('sky-card'), sk = eOut(prog(v, .15, .7));
    s.style.left = (W * (V ? .58 : .66)) + 'px'; s.style.top = (H * (V ? .14 : .1)) + 'px';
    s.style.opacity = sk;
    s.style.transform = `translateY(${lerp(-60, Math.sin(v * 2.4) * 8, sk)}px) rotateX(10deg) rotateY(-24deg) rotateZ(-4deg) scale(${lerp(.85, 1, sk)})`;
    flash = .7 * (1 - eOut(prog(v, 0, .2))) + .55 * eIn(prog(v, 1.38, 1.5));
  } else {                                            // ---------- E04 브랜드 엔딩
    show('e04', true);
    const w = t - 3.5, k = eOut(prog(w, 0, 1.5));
    $('e04-bg').style.transform = `translate(-50%,-50%) scale(${lerp(1.05, 1.0, k)})`;
    const lg = $('e04-logo'), la = eOut(prog(w, .08, .45));
    lg.style.left = '50%'; lg.style.top = V ? '44%' : '46%';
    lg.style.opacity = la;
    lg.style.transform = `translate(-50%,-50%) scale(${lerp(.92, 1, la)})`;
    const ua = eOut(prog(w, .35, .7));
    $('e04-url').style.opacity = ua;
    $('e04-url').style.transform = `translateY(${lerp(16, 0, ua)}px)`;
    // 로고 위·URL 아래를 지나가도록 세로 반지름을 로고 블록보다 크게
    orbitSVG($('e04-orbit'), W / 2, H * (V ? .44 : .45), W * (V ? .47 : .4), H * (V ? .15 : .3),
      lerp(-14, -9, k), eOut(prog(w, .1, .75)), 1, 'full');
    sparkSVG($('e04-sparks'), [[W * .18, H * .32, 1.2, 3.75], [W * .82, H * .2, 1.0, 3.9], [W * .72, H * .66, .7, 4.05]], t);
    flash = .55 * (1 - eOut(prog(w, 0, .2)));
    fade = eIO(prog(w, 1.1, 1.5));
  }
  $('flash').style.opacity = flash;
  $('fade').style.opacity = fade;
}
render(T);
document.title = 'ready';
</script>
</body>
</html>
